<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>お正月オニごっこ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --urushi:#1a0b0b; --shu:#c8102e; --kin:#e8b84a; --kami:#fbf5e8; --sumi:#2a1d1d; --matsu:#2f6b4a; --muted:#bfa9a0;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--urushi);color:var(--kami);font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;overflow:hidden;overscroll-behavior:none}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--kin);outline-offset:2px}
.brush{font-family:"Yuji Syuku",serif;font-weight:400}

/* ---------- ホスト（テレビ） ---------- */
#host{position:fixed;inset:0}
#tv{position:absolute;inset:0;width:100%;height:100%;display:block}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:3vmin;background:rgba(26,11,11,.82)}
.lobby{display:grid;grid-template-columns:auto 1fr;gap:5vmin;align-items:center;max-width:1400px;width:100%}
.lobby h1{font-size:9vmin;margin:0;line-height:1.1;color:var(--kin)}
.lobby h1 small{display:block;font-size:3vmin;color:var(--kami);font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;margin-top:1.5vmin;letter-spacing:.08em}
.rule{font-size:2.8vmin;line-height:1.7;margin:2vmin 0 0;color:var(--kami)}
.rule b{color:var(--kin)}
.qrbox{background:var(--kami);padding:2.4vmin;border-radius:1.2vmin;display:flex;flex-direction:column;align-items:center;gap:1.2vmin;color:var(--sumi)}
#qr img,#qr canvas{width:34vmin!important;height:34vmin!important;display:block}
.code{font-size:2.4vmin;font-weight:800;letter-spacing:.1em}
.url{font-size:1.5vmin;max-width:34vmin;word-break:break-all;text-align:center;color:#6b5a55}
.chips{display:flex;flex-wrap:wrap;gap:1.2vmin;margin-top:3vmin;min-height:6vmin}
.chip{display:flex;align-items:center;gap:1vmin;background:#2c1616;border:.25vmin solid #4a2a2a;border-radius:99px;padding:.8vmin 2vmin .8vmin 1vmin;font-size:2.6vmin;font-weight:800}
.chip i{width:3.4vmin;height:3.4vmin;border-radius:50%;display:inline-block}
.chip.empty{color:var(--muted);font-weight:500;border-style:dashed}
.actions{display:flex;gap:1.5vmin;margin-top:3vmin;flex-wrap:wrap}
.btn{border:0;border-radius:1vmin;padding:1.6vmin 3.6vmin;font-size:2.8vmin;font-weight:800;background:#3a1f1f;color:var(--kami)}
.btn.go{background:var(--shu);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.hint{font-size:1.9vmin;color:var(--muted);margin-top:1.4vmin}
.result{text-align:center}
.result h2{font-size:8vmin;margin:0 0 3vmin;color:var(--kin)}
.rank{list-style:none;margin:0 auto;padding:0;display:flex;flex-direction:column;gap:1.2vmin;width:min(70vmin,90vw)}
.rank li{display:grid;grid-template-columns:6vmin 4vmin 1fr auto;gap:2vmin;align-items:center;background:#2c1616;border-radius:1vmin;padding:1.4vmin 2.4vmin;font-size:3vmin;font-weight:800;font-variant-numeric:tabular-nums}
.rank li i{width:4vmin;height:4vmin;border-radius:50%}
.rank li.last{background:#5a1420}
.rank .n{color:var(--kin)}
.rank small{font-size:2vmin;color:var(--muted);font-weight:500}

/* ---------- コントローラー（スマホ） ---------- */
#pad{position:fixed;inset:0;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);gap:14px;touch-action:none;user-select:none;-webkit-user-select:none;transition:background .25s}
#pad.oni{background:#7a0f1f}
#pad.run{background:#133b2a}
.join{margin:auto 0;display:flex;flex-direction:column;gap:14px}
.join h1{font-size:40px;margin:0;color:var(--kin);line-height:1.2}
.join label{font-size:14px;color:var(--muted)}
.join input{font:inherit;font-size:22px;padding:12px 14px;border-radius:10px;border:2px solid #4a2a2a;background:#2c1616;color:var(--kami);width:100%}
.join .btn{font-size:22px;padding:16px}
.err{color:#ff9b9b;font-size:15px;min-height:1.4em}
.me{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800}
.me i{width:28px;height:28px;border-radius:50%}
.status{text-align:center;font-size:clamp(34px,11vw,56px);line-height:1.2;margin-top:4px}
.sub{text-align:center;font-size:16px;color:#e9dcd4;min-height:1.5em}
.stick{position:relative;flex:1;min-height:200px;border-radius:24px;border:3px dashed rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center}
.stick span{position:absolute;bottom:12px;font-size:13px;color:rgba(255,255,255,.6);text-align:center;padding:0 12px}
.knob{width:70px;height:70px;border-radius:50%;background:var(--kami);box-shadow:0 4px 0 rgba(0,0,0,.3);transform:translate(0,0)}
.row2{display:flex;gap:10px}
.row2 .btn{flex:1;font-size:16px;padding:12px}

/* 通信エラー時の再読み込みバー（全ゲーム共通） */
.netbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:100;display:flex;gap:12px;align-items:center;background:#2c1616;border:2px solid #c8102e;color:#fbf5e8;border-radius:12px;padding:10px 10px 10px 16px;font-size:16px;line-height:1.5;width:max-content;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.45)}
.netbar button{border:0;border-radius:8px;padding:12px 16px;font:inherit;font-weight:800;background:#c8102e;color:#fff;white-space:nowrap;cursor:pointer}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
</style>
</head>
<body>

<div id="host" hidden>
  <canvas id="tv"></canvas>
  <div class="overlay" id="lobby">
    <div class="lobby">
      <div class="qrbox"><div id="qr"></div><div class="code" id="code">接続中…</div><div class="url" id="url"></div></div>
      <div>
        <h1 class="brush">お正月<br>オニごっこ<small>スマホで読み取って参加</small></h1>
        <p class="rule"><b>スマホを傾けて</b>動きます。鬼にタッチされたら<b>鬼交代</b>。<br>60秒後、<b>鬼だった時間が短い人</b>の勝ち。</p>
        <div class="chips" id="chips"></div>
        <div class="actions">
          <button class="btn go" id="start" disabled>スタート</button>
          <button class="btn" id="addBot">CPUを追加</button>
          <button class="btn" id="addKey">PCのキーボードで参加</button>
        <a class="btn" href="../">ゲーム一覧</a></div>
        <div class="hint">2人以上で始められます。PCのキーボード操作は矢印キーかWASD。</div>
      </div>
    </div>
  </div>
  <div class="overlay" id="result" hidden>
    <div class="result">
      <h2 class="brush">結果</h2>
      <ol class="rank" id="rank"></ol>
      <div class="actions" style="justify-content:center"><button class="btn go" id="again">もう一回</button><button class="btn" id="toLobby">参加者を変える</button></div>
    </div>
  </div>
</div>

<div id="pad" hidden>
  <div class="join" id="joinForm">
    <h1 class="brush">お正月<br>オニごっこ</h1>
    <label for="name">なまえ（8文字まで）</label>
    <input id="name" maxlength="8" autocomplete="nickname" placeholder="例：おじいちゃん">
    <label for="room" id="roomLabel">部屋番号</label>
    <input id="room" inputmode="numeric" maxlength="6" placeholder="テレビに出ている番号">
    <button class="btn go" id="joinBtn">参加する</button>
    <div class="err" id="err"></div>
  </div>
  <div id="ctrl" hidden style="display:contents">
    <div class="me"><i id="myColor"></i><span id="myName"></span></div>
    <div class="status brush" id="status">待っててね</div>
    <div class="sub" id="sub">テレビの前で、みんなが揃うのを待とう</div>
    <div class="stick" id="stick"><div class="knob" id="knob"></div><span id="stickHint">スマホを傾けて動く ／ ここを指でなぞってもOK</span></div>
    <div class="row2"><button class="btn" id="calib">今の傾きを「止まる」にする</button></div>
  </div>
</div>

<div class="netbar" id="netbar" role="alert" hidden><span id="netmsg"></span><button id="netreload">再読み込み</button></div>
<script>
// 通信エラー時の再読み込みバー。スマホは部屋番号付きで開き直すので、なまえを入れて押すだけで戻れる
function showNetError(msg,room){
  const b=document.getElementById('netbar');document.getElementById('netmsg').textContent=msg;b.hidden=false;
  document.getElementById('netreload').onclick=()=>{ if(room)location.href=location.pathname+'?join='+room; else location.reload(); };
}
const PREFIX='oshogatsu-oni-';
const COLORS=['#f4c430','#3fa7d6','#7bc950','#f28cc4','#a57ff0','#ff8c42','#5ce1e6','#ffffff'];
const params=new URLSearchParams(location.search);
const joinCode=params.get('join');
const isPad=joinCode!==null || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) && !params.has('host');
const PEER_OPTS={debug:0};

if(isPad) startPad(); else startHost();

/* =====================================================
   ホスト：テレビに映す画面
   ===================================================== */
function startHost(){
  document.getElementById('host').hidden=false;
  const $=id=>document.getElementById(id);
  const tv=$('tv'),g=tv.getContext('2d');
  const WW=1600,WH=900,R=34,ROUND=60;
  const OBST=[{x:800,y:450,r:74},{x:420,y:250,r:52},{x:1180,y:650,r:52},{x:420,y:650,r:46},{x:1180,y:250,r:46}];
  const players=new Map(); // id -> player
  let phase='lobby',timer=0,count=0,audio=null;
  const keys={};

  const code=String(Math.floor(100000+Math.random()*900000));
  const joinUrl=location.origin+location.pathname+'?join='+code;
  const peer=new Peer(PREFIX+code,PEER_OPTS);
  peer.on('open',()=>{
    $('code').textContent='部屋番号 '+code;
    $('url').textContent=joinUrl;
    if(/^(localhost|127\.0\.0\.1)$/.test(location.hostname))$('url').textContent+='　※localhostのQRはスマホで開けません。PCのIPアドレス（例：http://192.168.x.x:ポート）でこの画面を開き直してください';
    new QRCode($('qr'),{text:joinUrl,width:512,height:512,correctLevel:QRCode.CorrectLevel.M});
  });
  peer.on('error',e=>{ showNetError('テレビ側の通信が切れました。再読み込みすると部屋番号が変わるので、スマホは新しいQRで入り直してください'); $('code').textContent='接続エラー：'+(e.type==='unavailable-id'?'番号が重複しました。再読み込みしてください':e.type); });
  peer.on('disconnected',()=>{ try{peer.reconnect()}catch(_){} });
  peer.on('connection',conn=>{
    conn.on('data',msg=>{
      if(!msg||typeof msg!=='object')return;
      if(msg.t==='hello'){
        let p=players.get(conn.peer);
        if(!p){ if(players.size>=8){conn.send({t:'full'});return} p=newPlayer(conn.peer,String(msg.name||'だれか').slice(0,8),'phone');p.conn=conn;players.set(conn.peer,p); if(phase!=='lobby'){p.spectator=true} }
        p.conn=conn;
        conn.send({t:'welcome',color:p.color,name:p.name});
        sendState(p); renderLobby();
      } else if(msg.t==='in'){
        const p=players.get(conn.peer); if(!p)return;
        p.ix=clamp(+msg.x||0,-1,1); p.iy=clamp(+msg.y||0,-1,1); p.lastIn=performance.now();
      }
    });
    conn.on('close',()=>{ const p=players.get(conn.peer); if(!p)return; players.delete(conn.peer); if(p.oni&&phase==='play')pickOni(); renderLobby(); });
  });

  function newPlayer(id,name,kind){
    const used=new Set([...players.values()].map(p=>p.color));
    const color=COLORS.find(c=>!used.has(c))||COLORS[players.size%COLORS.length];
    return {id,name,kind,color,x:0,y:0,ix:0,iy:0,lastIn:0,oni:false,frozen:0,immune:0,oniTime:0,spectator:false,conn:null,wander:Math.random()*6.28};
  }
  function active(){return [...players.values()].filter(p=>!p.spectator)}
  function renderLobby(){
    const c=$('chips');c.innerHTML='';
    const list=[...players.values()];
    if(!list.length){c.innerHTML='<span class="chip empty">まだ誰もいません</span>'}
    for(const p of list){const s=document.createElement('span');s.className='chip';const i=document.createElement('i');i.style.background=p.color;s.append(i,document.createTextNode(p.name+(p.kind==='bot'?'（CPU）':p.kind==='key'?'（PC）':'')));c.append(s)}
    $('start').disabled=list.length<2;
    $('addKey').disabled=list.some(p=>p.kind==='key');
  }
  renderLobby();

  $('addBot').onclick=()=>{ if(players.size>=8)return; const n=[...players.values()].filter(p=>p.kind==='bot').length+1; const id='bot'+Date.now(); players.set(id,newPlayer(id,'CPU'+n,'bot')); renderLobby(); };
  $('addKey').onclick=()=>{ if(players.size>=8)return; players.set('key',newPlayer('key','PCの人','key')); renderLobby(); };
  $('start').onclick=startRound;
  $('again').onclick=startRound;
  $('toLobby').onclick=()=>{phase='lobby';$('result').hidden=true;$('lobby').hidden=false;players.forEach(p=>p.spectator=false);broadcast();renderLobby()};
  addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true; if(e.key===' '&&phase==='lobby'&&!$('start').disabled){e.preventDefault();startRound()}});
  addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});

  function startRound(){
    if(!audio){try{audio=new (window.AudioContext||window.webkitAudioContext)()}catch(_){}}
    players.forEach(p=>p.spectator=false);
    const list=active(); if(list.length<2)return;
    // 円形に配置
    list.forEach((p,i)=>{const a=i/list.length*Math.PI*2-Math.PI/2;p.x=WW/2+Math.cos(a)*330;p.y=WH/2+Math.sin(a)*300;p.oni=false;p.frozen=0;p.immune=0;p.oniTime=0});
    const o=list[Math.floor(Math.random()*list.length)];o.oni=true;o.frozen=1.5;
    phase='count';count=3;timer=ROUND;
    $('lobby').hidden=true;$('result').hidden=true;
    beep(440,.12);broadcast();
  }
  function pickOni(){const list=active();if(!list.length)return;const o=list[Math.floor(Math.random()*list.length)];o.oni=true;o.frozen=1.5;broadcast()}
  function endRound(){
    phase='result';
    const list=active().sort((a,b)=>a.oniTime-b.oniTime);
    const ol=$('rank');ol.innerHTML='';
    list.forEach((p,i)=>{
      const li=document.createElement('li');if(p.oni)li.className='last';
      const n=document.createElement('span');n.className='n';n.textContent=(i+1)+'位';
      const c=document.createElement('i');c.style.background=p.color;
      const nm=document.createElement('span');nm.textContent=p.name;if(p.oni){const s=document.createElement('small');s.textContent='　最後の鬼';nm.append(s)}
      const t=document.createElement('span');t.textContent='鬼 '+p.oniTime.toFixed(1)+'秒';
      li.append(n,c,nm,t);ol.append(li);
    });
    $('result').hidden=false; beep(660,.15);setTimeout(()=>beep(880,.25),160); broadcast();
  }

  function sendState(p){
    if(!p.conn||!p.conn.open)return;
    const list=active().sort((a,b)=>a.oniTime-b.oniTime);
    p.conn.send({t:'st',phase,oni:p.oni,frozen:p.frozen>0,spectator:p.spectator,count:Math.ceil(count),time:Math.ceil(timer),
      rank:phase==='result'?list.findIndex(q=>q===p)+1:0,total:list.length,last:phase==='result'&&p.oni});
  }
  function broadcast(){players.forEach(sendState)}
  setInterval(()=>{if(phase!=='lobby')broadcast()},500);

  function beep(f,d){ if(!audio)return; try{const o=audio.createOscillator(),v=audio.createGain();o.frequency.value=f;o.type='triangle';v.gain.setValueAtTime(.18,audio.currentTime);v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(v).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(_){} }

  function botInput(p,list){
    const oni=list.find(q=>q.oni);
    let dx=0,dy=0;
    if(p.oni){
      let best=null,bd=1e9;for(const q of list){if(q===p||q.immune>0)continue;const d=Math.hypot(q.x-p.x,q.y-p.y);if(d<bd){bd=d;best=q}}
      if(best){dx=best.x-p.x;dy=best.y-p.y}
    } else if(oni){
      const d=Math.hypot(p.x-oni.x,p.y-oni.y)||1;
      if(d<520){dx=(p.x-oni.x)/d;dy=(p.y-oni.y)/d}
      else{p.wander+=(Math.random()-.5)*.3;dx=Math.cos(p.wander)*.4;dy=Math.sin(p.wander)*.4}
      const m=170;
      if(p.x<m)dx+=(m-p.x)/m*1.6; if(p.x>WW-m)dx-=(p.x-WW+m)/m*1.6;
      if(p.y<m)dy+=(m-p.y)/m*1.6; if(p.y>WH-m)dy-=(p.y-WH+m)/m*1.6;
    }
    for(const o of OBST){const d=Math.hypot(p.x-o.x,p.y-o.y);if(d<o.r+R+60){dx+=(p.x-o.x)/d*.8;dy+=(p.y-o.y)/d*.8}}
    const l=Math.hypot(dx,dy);if(l>0){dx/=l;dy/=l}
    p.ix=dx*.82;p.iy=dy*.82;
  }

  function update(dt){
    if(phase==='count'){count-=dt;const c=Math.ceil(count);if(c!==Math.ceil(count+dt)&&c>0)beep(440,.1);if(count<=0){phase='play';beep(880,.2);broadcast()}return}
    if(phase!=='play')return;
    timer-=dt; if(timer<=0){timer=0;endRound();return}
    const list=active(),now=performance.now();
    for(const p of list){
      if(p.kind==='bot')botInput(p,list);
      else if(p.kind==='key'){let x=0,y=0;if(keys.arrowleft||keys.a)x--;if(keys.arrowright||keys.d)x++;if(keys.arrowup||keys.w)y--;if(keys.arrowdown||keys.s)y++;const l=Math.hypot(x,y)||1;p.ix=x/l;p.iy=y/l}
      else if(now-p.lastIn>1500){p.ix=0;p.iy=0}
      if(p.oni)p.oniTime+=dt;
      if(p.frozen>0){const was=p.frozen;p.frozen-=dt;if(was>0&&p.frozen<=0)sendState(p);continue}
      if(p.immune>0)p.immune-=dt;
      const sp=p.oni?300:270;
      p.x+=p.ix*sp*dt;p.y+=p.iy*sp*dt;
      p.x=clamp(p.x,R,WW-R);p.y=clamp(p.y,R,WH-R);
      for(const o of OBST){const dx=p.x-o.x,dy=p.y-o.y,d=Math.hypot(dx,dy)||1,min=o.r+R;if(d<min){p.x=o.x+dx/d*min;p.y=o.y+dy/d*min}}
    }
    const oni=list.find(p=>p.oni);
    if(oni&&oni.frozen<=0){
      for(const q of list){
        if(q===oni||q.immune>0)continue;
        if(Math.hypot(q.x-oni.x,q.y-oni.y)<R*2){
          oni.oni=false;oni.immune=1.5;q.oni=true;q.frozen=1.5;
          beep(220,.2);flash={x:q.x,y:q.y,t:.5};sendState(oni);sendState(q);break;
        }
      }
    }
  }
  let flash=null;

  /* ---- 描画 ---- */
  let scale=1,ox=0,oy=0;
  function resize(){const dpr=Math.min(2,devicePixelRatio||1);tv.width=innerWidth*dpr;tv.height=innerHeight*dpr;scale=Math.min(tv.width/WW,tv.height/WH)*.96;ox=(tv.width-WW*scale)/2;oy=(tv.height-WH*scale)/2}
  addEventListener('resize',resize);resize();

  function drawFloor(){
    g.fillStyle='#1a0b0b';g.fillRect(0,0,tv.width,tv.height);
    g.save();g.translate(ox,oy);g.scale(scale,scale);
    // 畳
    g.fillStyle='#c9bf8e';g.fillRect(0,0,WW,WH);
    const tw=WW/8,th=WH/4;
    for(let r=0;r<4;r++)for(let c=0;c<8;c++){
      g.fillStyle=(r+c)%2?'#cdc394':'#c4ba88';g.fillRect(c*tw,r*th,tw,th);
      g.strokeStyle='rgba(90,80,40,.12)';g.lineWidth=1;for(let k=6;k<tw;k+=6){g.beginPath();g.moveTo(c*tw+k,r*th);g.lineTo(c*tw+k,r*th+th);g.stroke()}
      g.fillStyle='#2e3b2a';g.fillRect(c*tw,r*th,tw,5);g.fillRect(c*tw,r*th,5,th);
    }
    g.strokeStyle='#c8102e';g.lineWidth=14;g.strokeRect(7,7,WW-14,WH-14);
    // 鏡餅
    for(const o of OBST){
      g.fillStyle='rgba(0,0,0,.18)';g.beginPath();g.ellipse(o.x+6,o.y+10,o.r,o.r*.9,0,0,Math.PI*2);g.fill();
      g.fillStyle='#f6f1e4';g.beginPath();g.arc(o.x,o.y,o.r,0,Math.PI*2);g.fill();
      g.strokeStyle='#e0d6bf';g.lineWidth=3;g.stroke();
      g.fillStyle='#fffdf6';g.beginPath();g.arc(o.x,o.y,o.r*.66,0,Math.PI*2);g.fill();
      g.fillStyle='#ff9f1c';g.beginPath();g.arc(o.x,o.y,o.r*.3,0,Math.PI*2);g.fill();
      g.fillStyle='#2f6b4a';g.beginPath();g.ellipse(o.x+o.r*.22,o.y-o.r*.22,o.r*.16,o.r*.07,-.6,0,Math.PI*2);g.fill();
    }
    g.restore();
  }
  function drawPlayer(p,t){
    g.save();g.translate(ox,oy);g.scale(scale,scale);
    const blink=p.immune>0&&Math.floor(t*10)%2===0;
    g.globalAlpha=blink?.45:1;
    if(p.oni){
      const pulse=1+Math.sin(t*8)*.08;
      g.fillStyle='rgba(200,16,46,.28)';g.beginPath();g.arc(p.x,p.y,R*1.7*pulse,0,Math.PI*2);g.fill();
    }
    g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.ellipse(p.x+4,p.y+8,R,R*.85,0,0,Math.PI*2);g.fill();
    g.fillStyle=p.color;g.beginPath();g.arc(p.x,p.y,R,0,Math.PI*2);g.fill();
    g.lineWidth=5;g.strokeStyle=p.oni?'#c8102e':'#2a1d1d';g.stroke();
    // 顔
    g.fillStyle='#2a1d1d';
    const lx=p.ix*6,ly=p.iy*6;
    g.beginPath();g.arc(p.x-10+lx,p.y-4+ly,4,0,Math.PI*2);g.arc(p.x+10+lx,p.y-4+ly,4,0,Math.PI*2);g.fill();
    if(p.oni){
      g.fillStyle='#fbf5e8';g.strokeStyle='#2a1d1d';g.lineWidth=3;
      for(const s of[-1,1]){g.beginPath();g.moveTo(p.x+s*10,p.y-R+6);g.lineTo(p.x+s*20,p.y-R-18);g.lineTo(p.x+s*24,p.y-R+10);g.closePath();g.fill();g.stroke()}
      g.fillStyle='#c8102e';g.font='bold 30px "Yuji Syuku", serif';g.textAlign='center';g.fillText('鬼',p.x,p.y+R+32);
    }
    if(p.frozen>0){g.strokeStyle='#e8b84a';g.lineWidth=6;g.beginPath();g.arc(p.x,p.y,R+10,-Math.PI/2,-Math.PI/2+Math.PI*2*(p.frozen/1.5));g.stroke()}
    g.globalAlpha=1;
    g.font='800 26px "M PLUS Rounded 1c", sans-serif';g.textAlign='center';
    g.lineWidth=6;g.strokeStyle='#2a1d1d';g.strokeText(p.name,p.x,p.y-R-(p.oni?26:12));
    g.fillStyle='#fbf5e8';g.fillText(p.name,p.x,p.y-R-(p.oni?26:12));
    g.restore();
  }
  function hud(){
    g.save();g.translate(ox,oy);g.scale(scale,scale);g.textAlign='center';
    if(phase==='play'||phase==='count'){
      g.fillStyle='rgba(26,11,11,.8)';g.beginPath();g.roundRect(WW/2-90,18,180,70,14);g.fill();
      g.fillStyle=timer<=10?'#ff6b6b':'#e8b84a';g.font='800 50px "M PLUS Rounded 1c", sans-serif';g.fillText(Math.ceil(timer),WW/2,72);
    }
    if(phase==='count'){
      g.fillStyle='rgba(26,11,11,.55)';g.fillRect(0,0,WW,WH);
      g.fillStyle='#fbf5e8';g.font='220px "Yuji Syuku", serif';g.fillText(Math.max(1,Math.ceil(count)),WW/2,WH/2+80);
      const o=active().find(p=>p.oni);if(o){g.font='800 44px "M PLUS Rounded 1c", sans-serif';g.fillStyle='#e8b84a';g.fillText('最初の鬼は '+o.name,WW/2,WH/2+180)}
    }
    if(flash&&flash.t>0){g.strokeStyle=`rgba(232,184,74,${flash.t*2})`;g.lineWidth=10;g.beginPath();g.arc(flash.x,flash.y,R+(0.5-flash.t)*260,0,Math.PI*2);g.stroke()}
    g.restore();
  }
  // ゲームの進行は画面描画と切り離して動かす（テレビ側のタブが裏に回っても止まらない）
  let last=performance.now();
  setInterval(()=>{
    const now=performance.now();let dt=Math.min(1,(now-last)/1000);last=now;
    while(dt>0){const st=Math.min(.05,dt);update(st);if(flash)flash.t-=st;dt-=st}
  },16);
  function loop(now){
    drawFloor();
    const t=now/1000;
    if(phase!=='lobby')active().sort((a,b)=>a.y-b.y).forEach(p=>drawPlayer(p,t));
    hud();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}

/* =====================================================
   コントローラー：スマホの画面
   ===================================================== */
function startPad(){
  const $=id=>document.getElementById(id);
  $('pad').hidden=false;
  const store={get:k=>{try{return localStorage.getItem(k)}catch(_){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(_){}}};
  $('name').value=store.get('oni-name')||'';
  if(joinCode){$('room').value=joinCode;$('room').hidden=true;$('roomLabel').hidden=true}
  let peer=null,conn=null,gx=0,gy=0,tx=0,ty=0,touching=false,base=null,lastOri=null,hasGyro=false,wake=null;

  $('joinBtn').onclick=async()=>{
    const name=$('name').value.trim();const room=$('room').value.trim();
    if(!name){$('err').textContent='なまえを入れてください';return}
    if(!/^\d{6}$/.test(room)){$('err').textContent='部屋番号は6桁の数字です';return}
    store.set('oni-name',name);
    // iPhoneは傾きセンサーの許可がボタン操作の中で必要
    try{ if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){ await DeviceOrientationEvent.requestPermission() } }catch(_){}
    addEventListener('deviceorientation',onOri);
    try{wake=await navigator.wakeLock?.request('screen')}catch(_){}
    $('joinBtn').disabled=true;$('err').textContent='つないでいます…';
    connect(name,room);
  };
  function connect(name,room){
    peer=new Peer(PEER_OPTS);
    peer.on('open',()=>{
      conn=peer.connect(PREFIX+room,{reliable:false});
      const to=setTimeout(()=>{if(!conn.open){$('err').textContent='つながりません。部屋番号とテレビの画面を確かめてください';$('joinBtn').disabled=false}},9000);
      conn.on('open',()=>{clearTimeout(to);conn.send({t:'hello',name})});
      conn.on('data',onMsg);
      conn.on('close',()=>{$('status').textContent='切断されました';$('sub').textContent='下の「再読み込み」で入り直せます';$('pad').className='';showNetError('テレビとの通信が切れました',room)});
    });
    peer.on('error',e=>{if(e.type!=='peer-unavailable')showNetError('通信エラーが起きました（'+e.type+'）',room);$('err').textContent=e.type==='peer-unavailable'?($('room').hidden=$('roomLabel').hidden=false,'その部屋番号は見つかりません。テレビに出ている新しい部屋番号を入れてください'):'エラー：'+e.type;$('joinBtn').disabled=false});
  }
  function onMsg(m){
    if(m.t==='full'){$('err').textContent='満員です（8人まで）';return}
    if(m.t==='welcome'){
      $('joinForm').hidden=true;$('ctrl').hidden=false;
      $('myColor').style.background=m.color;$('myName').textContent=m.name;
      setInterval(sendInput,50);
    }
    if(m.t==='st')showState(m);
  }
  let wasOni=false;
  function showState(s){
    const pad=$('pad');
    if(s.phase==='lobby'){pad.className='';set('待っててね','テレビの前で、みんなが揃うのを待とう');return}
    if(s.spectator){pad.className='';set('次から参加','このゲームが終わるまで見ててね');return}
    if(s.phase==='count'){pad.className=s.oni?'oni':'run';set(s.count+'…',s.oni?'あなたが最初の鬼！':'鬼から逃げる準備');}
    else if(s.phase==='play'){
      pad.className=s.oni?'oni':'run';
      if(s.oni)set('あなたが鬼！',s.frozen?'ちょっと待って…':'近くの人にタッチしに行こう');
      else set('逃げて！','残り '+s.time+' 秒');
      if(s.oni&&!wasOni)try{navigator.vibrate?.([200,80,200])}catch(_){}
    }
    else if(s.phase==='result'){pad.className='';set(s.rank+'位',s.last?'最後の鬼でした…':s.total+'人中')}
    wasOni=s.oni;
  }
  function set(a,b){$('status').textContent=a;$('sub').textContent=b}

  function onOri(e){
    if(e.beta==null)return;hasGyro=true;lastOri=e;
    if(!base)base={b:e.beta,g:e.gamma};
    const range=22;
    gx=clamp((e.gamma-base.g)/range,-1,1);gy=clamp((e.beta-base.b)/range,-1,1);
    if(Math.abs(gx)<.08)gx=0;if(Math.abs(gy)<.08)gy=0;
  }
  $('calib').onclick=()=>{if(lastOri)base={b:lastOri.beta,g:lastOri.gamma};gx=gy=0};

  const stick=$('stick'),knob=$('knob');let sc=null;
  stick.addEventListener('pointerdown',e=>{touching=true;try{stick.setPointerCapture(e.pointerId)}catch(_){}sc=[e.clientX,e.clientY];tx=ty=0});
  stick.addEventListener('pointermove',e=>{if(!touching)return;const dx=e.clientX-sc[0],dy=e.clientY-sc[1],m=70;tx=clamp(dx/m,-1,1);ty=clamp(dy/m,-1,1)});
  const end=()=>{touching=false;tx=ty=0};stick.addEventListener('pointerup',end);stick.addEventListener('pointercancel',end);

  function sendInput(){
    let x=touching?tx:gx,y=touching?ty:gy;
    const l=Math.hypot(x,y);if(l>1){x/=l;y/=l}
    knob.style.transform=`translate(${x*60}px,${y*60}px)`;
    if(!hasGyro)$('stickHint').textContent='ここを指でなぞって動かす';
    if(conn&&conn.open)conn.send({t:'in',x:+x.toFixed(2),y:+y.toFixed(2)});
  }
  document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&wake!==null){try{wake=await navigator.wakeLock?.request('screen')}catch(_){}}});
}

function clamp(v,a,b){return v<a?a:v>b?b:v}
</script>
